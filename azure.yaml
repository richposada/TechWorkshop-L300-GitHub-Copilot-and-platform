# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: zavastore
metadata:
  template: zavastore@0.0.1-beta

services:
  web:
    project: ./src
    language: dotnet
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ./src

# Configure infrastructure provisioning
infra:
  provider: bicep
  path: infra
  module: main

# Hooks for custom deployment steps
hooks:
  preprovision:
    posix:
      shell: sh
      run: echo "Starting infrastructure provisioning..."
    windows:
      shell: pwsh
      run: echo "Starting infrastructure provisioning..."
  
  postprovision:
    posix:
      shell: sh
      run: |
        echo "Infrastructure provisioned successfully"
        echo "Building and pushing Docker image to ACR..."
    windows:
      shell: pwsh
      run: |
        echo "Infrastructure provisioned successfully"
        echo "Building and pushing Docker image to ACR..."

# Pipeline configuration
pipeline:
  provider: github
