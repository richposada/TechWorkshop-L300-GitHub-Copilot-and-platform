name: Build and Push to ACR

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/acr-build-push.yml'
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  ACR_NAME: '' # Set by deployment or manually
  IMAGE_NAME: 'zavastore'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR name from Azure
        id: get-acr
        run: |
          # Get ACR name from resource group (adjust resource group name as needed)
          ACR_NAME=$(az acr list --resource-group rg-zavastore-dev-westus3 --query "[0].name" -o tsv)
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "ACR Name: $ACR_NAME"

      - name: Build and push image to ACR
        run: |
          ACR_NAME="${{ steps.get-acr.outputs.acr_name }}"
          IMAGE_TAG="${{ github.event.inputs.imageTag || 'latest' }}"
          
          # Build and push using ACR build (cloud-based, no local Docker required)
          az acr build \
            --registry $ACR_NAME \
            --image ${{ env.IMAGE_NAME }}:$IMAGE_TAG \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --file Dockerfile \
            .

      - name: Update Web App with new image
        run: |
          ACR_NAME="${{ steps.get-acr.outputs.acr_name }}"
          IMAGE_TAG="${{ github.event.inputs.imageTag || 'latest' }}"
          
          # Update the web app to use the new image
          az webapp config container set \
            --name app-zavastore-dev-westus3 \
            --resource-group rg-zavastore-dev-westus3 \
            --docker-custom-image-name $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$IMAGE_TAG \
            --docker-registry-server-url https://$ACR_NAME.azurecr.io

      - name: Restart Web App
        run: |
          az webapp restart \
            --name app-zavastore-dev-westus3 \
            --resource-group rg-zavastore-dev-westus3
