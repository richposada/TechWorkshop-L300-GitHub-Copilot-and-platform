name: Build and Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to Azure Container Registry
      run: |
        az acr login --name ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/zavasf/web:${{ github.sha }} -t ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/zavasf/web:latest ./src
        docker push ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/zavasf/web:${{ github.sha }}
        docker push ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/zavasf/web:latest

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_APP_SERVICE_NAME }}
        images: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/zavasf/web:${{ github.sha }}

    - name: Azure logout
      if: always()
      run: az logout
